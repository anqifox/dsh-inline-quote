name: Syntax smoke (no DSH host)
on:
  push:
    branches: [feat/v0.2-trajectory-selection]
  pull_request:
    paths:
      - 'client.js'
      - 'tests/e2e/**'
      - '.github/workflows/syntax-smoke.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check plugin and e2e JavaScript syntax
        run: |
          node --check client.js
          node --check tests/e2e/inline-quote-trajectory-selection-test.mjs
          node --check tests/e2e/run-regressions.mjs
