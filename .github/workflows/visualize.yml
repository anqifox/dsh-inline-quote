name: Generate Repo Visualizer Diagram

on:
  workflow_dispatch: # 支持在 GitHub 网页上一键手动触发
  push:
    branches: [ main, master ] # 每次更新代码时自动重新画图

jobs:
  visualize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate diagram
        uses: github/repo-visualizer@v1
        with:
          output_file: "diagram.svg" # 生成的图片文件名
          excluded_paths: "node_modules, .git, tests" # 自动过滤掉冗余的测试和依赖节点！

      - name: Commit and push SVG
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add diagram.svg
          git commit -m "docs: update repo visualization diagram" || exit 0
          git push
          
