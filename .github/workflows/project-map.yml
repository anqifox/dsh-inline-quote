name: Reusable Project Map Build

on:
  workflow_call:
    inputs:
      records:
        type: string
        required: false
        default: .project-map/map.json
      engine_ref:
        type: string
        required: false
        default: main
  workflow_dispatch:
    inputs:
      records:
        type: string
        required: false
        default: .project-map/map.json
      engine_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read

jobs:
  validate-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out calling project and full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out shared renderer (always from tool repository)
        uses: actions/checkout@v4
        with:
          repository: anqifox/dsh-inline-quote
          ref: ${{ github.repository == 'anqifox/dsh-inline-quote' && github.event_name == 'pull_request' && github.head_ref || inputs.engine_ref || 'main' }}
          path: .project-map-engine

      - name: Use existing Graphviz renderer
        run: |
          if ! command -v dot >/dev/null; then
            sudo apt-get update && sudo apt-get install -y graphviz
          fi

      - name: Verify record validation rejects invalid inputs
        run: python3 .project-map-engine/tools/project-map/render.py --input "${{ inputs.records || '.project-map/map.json' }}" --self-test

      - name: Build observed project map and evidence index
        run: python3 .project-map-engine/tools/project-map/render.py --input "${{ inputs.records || '.project-map/map.json' }}" --output project-map-output

      - name: Add human-readable build report
        if: always()
        shell: bash
        run: |
          echo "## Project Map validation" >> "$GITHUB_STEP_SUMMARY"
          if [ -f project-map-output/report.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("project-map-output/report.json", encoding="utf-8"))
          m = d["measurements"]
          print("- **Result:** validated source records (not a runtime test)")
          print("- **Commit:** " + d["revision"])
          print("- **Nodes:** " + str(m["counts"]["nodes"]))
          print("- **Source-backed edges:** " + str(m["source_backed_edges"]))
          print("- **Unverified declared edges:** " + str(m["declared_only_edges"]))
          print("- **Resolved evidence references:** " + str(m["resolved_evidence"]))
          print("- **Output:** download artifact project-map-evidence for SVG, notes, report JSON, and DOT")
          PY
          else
            echo "- **Result:** failed; inspect the failing validation step. No diagram published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish inspectable result as an Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: project-map-evidence
          path: project-map-output/
          if-no-files-found: error
          retention-days: 30
