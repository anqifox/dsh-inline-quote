name: Project Map MVP Acceptance

on:
  pull_request:
    paths:
      - '.project-map/**'
      - 'tools/project-map/**'
      - '.github/workflows/project-map.yml'
      - '.github/workflows/project-map-acceptance.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.project-map/**'
      - 'tools/project-map/**'
      - '.github/workflows/project-map.yml'
      - '.github/workflows/project-map-acceptance.yml'

permissions:
  contents: read

jobs:
  verify-map:
    uses: ./.github/workflows/project-map.yml
    with:
      records: .project-map/map.json
